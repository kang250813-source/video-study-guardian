name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "bank/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Version info
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VSG_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VSG_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "VSG_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # 可选：在仓库 Settings → Secrets 里配置正式签名密钥；没有配置时自动使用调试签名
      - name: Decode signing keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VSG_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets."
          else
            echo "No keystore secret; the APK will be debug-signed."
          fi

      - name: Build APK
        working-directory: android
        env:
          VSG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VSG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VSG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/VideoStudyGuardian.apk
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudyGuardian
          path: dist/VideoStudyGuardian.apk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoStudyGuardian.apk
          generate_release_notes: true
